x-app: &app
  build: .
  environment: &environment
    NODE_ENV: production
    DATABASE_URL: postgresql://orders:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/orders
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET with at least 32 characters}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: orders
      POSTGRES_DB: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-bookworm
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *app
    command:
      [
        node,
        node_modules/typeorm/cli.js,
        migration:run,
        -d,
        dist/database/data-source.js,
      ]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: [node, dist/worker.js]
    environment:
      <<: *environment
      PORT: "3001"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
  redis-data:
